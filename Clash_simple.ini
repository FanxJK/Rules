[custom]
clash_rule_base=https://raw.githubusercontent.com/FanxJK/Rules/main/General_dns.yml

ruleset=🚀 Proxy,https://raw.githubusercontent.com/FanxJK/Rules/main/Clash/Proxy.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/FanxJK/Rules/main/Clash/Direct.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownload/GameDownload.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.list
ruleset=🛡️ Privacy,https://raw.githubusercontent.com/FanxJK/Rules/main/Clash/Privacy.list
ruleset=Ⓜ️ Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=Ⓜ️ Microsoft,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Xbox/Xbox.list
ruleset=🍎 Apple,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list
ruleset=🎯 Direct,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
ruleset=🚀 Proxy,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 Direct,[]GEOIP,LAN
ruleset=🎯 Direct,[]GEOIP,CN
ruleset=🏁 Final,[]FINAL

custom_proxy_group=🚀 Proxy`select`[]🇭🇰 Hong Kong`[]🇨🇳 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🚀 Manual`[]♻️ Auto`[]DIRECT
custom_proxy_group=🚀 Manual`select`.*
custom_proxy_group=♻️ Auto`url-test`.*`https://cp.cloudflare.com/generate_204`60,,50

custom_proxy_group=🛡️ Privacy`select`[]REJECT`[]🚀 Proxy`[]🎯 Direct
custom_proxy_group=Ⓜ️ Microsoft`select`[]🎯 Direct`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇨🇳 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🚀 Manual
custom_proxy_group=🍎 Apple`select`[]🎯 Direct`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇨🇳 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🚀 Manual
custom_proxy_group=🎯 Direct`select`[]DIRECT`[]🚀 Proxy`[]🚀 Manual
custom_proxy_group=🏁 Final`select`[]🚀 Proxy`[]🇭🇰 Hong Kong`[]🇨🇳 Taiwan`[]🇯🇵 Japan`[]🇸🇬 Singapore`[]🇺🇸 United States`[]🚀 Manual`[]🎯 Direct

custom_proxy_group=🇭🇰 Hong Kong`url-test`(?i)(香港|Hong ?Kong|(^|[^A-Za-z])HK)`https://cp.cloudflare.com/generate_204`60,,50
custom_proxy_group=🇨🇳 Taiwan`url-test`(?i)(台湾|台灣|Taiwan|(^|[^A-Za-z])TW)`https://cp.cloudflare.com/generate_204`60,,50
custom_proxy_group=🇸🇬 Singapore`url-test`(?i)(新加坡|Singapore|(^|[^A-Za-z])SG)`https://cp.cloudflare.com/generate_204`60,,50
custom_proxy_group=🇯🇵 Japan`url-test`(?i)(日本|Japan|(^|[^A-Za-z])JP)`https://cp.cloudflare.com/generate_204`60,,50
custom_proxy_group=🇺🇸 United States`url-test`(?i)(美国|美國|United States|(^|[^A-Za-z])US)`https://cp.cloudflare.com/generate_204`60,,50

enable_rule_generator=true
overwrite_original_rules=true
